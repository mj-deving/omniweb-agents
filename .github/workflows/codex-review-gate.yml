name: Codex Review Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  codex-review:
    name: codex-review
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Require Codex signal on latest PR head
        uses: actions/github-script@v7
        with:
          script: |
            const codexLogins = new Set([
              'chatgpt-codex-connector[bot]',
              'chatgpt-codex-connector',
            ]);

            async function resolvePullRequest() {
              if (context.payload.pull_request) {
                return context.payload.pull_request;
              }

              if (context.payload.review && context.payload.pull_request) {
                return context.payload.pull_request;
              }

              if (context.payload.issue && context.payload.issue.pull_request) {
                const response = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.issue.number,
                });
                return response.data;
              }

              return null;
            }

            function isCodexActor(user) {
              return user && codexLogins.has(user.login);
            }

            function isAfterHead(value, headDate) {
              const date = new Date(value);
              return !Number.isNaN(date.valueOf()) && date >= headDate;
            }

            const pr = await resolvePullRequest();
            if (!pr) {
              core.setFailed('Codex review gate only runs for pull requests.');
              return;
            }

            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const headSha = pull.data.head.sha;
            const headCommit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
            });
            const headDate = new Date(
              headCommit.data.commit.committer?.date ||
                headCommit.data.commit.author?.date ||
                pull.data.updated_at
            );

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const codexReviews = reviews.filter((review) => isCodexActor(review.user));
            const blockingHeadReview = codexReviews.find(
              (review) => review.commit_id === headSha && review.state === 'CHANGES_REQUESTED'
            );
            const acceptedHeadReview = codexReviews.find(
              (review) =>
                review.commit_id === headSha &&
                ['APPROVED', 'COMMENTED'].includes(review.state)
            );

            core.summary
              .addHeading('Codex review gate')
              .addRaw(`PR: #${pr.number}`)
              .addEOL()
              .addRaw(`Head SHA: ${headSha}`)
              .addEOL()
              .addRaw(`Codex reviews found: ${codexReviews.length}`)
              .addEOL();

            if (blockingHeadReview) {
              core.summary
                .addRaw('Result: fail - Codex requested changes on the latest head.')
                .addEOL();
              await core.summary.write();
              core.setFailed('Codex requested changes on the latest PR head.');
              return;
            }

            if (acceptedHeadReview) {
              core.summary
                .addRaw(
                  `Result: pass - Codex ${acceptedHeadReview.state.toLowerCase()} review exists on latest head.`
                )
                .addEOL();
              await core.summary.write();
              return;
            }

            const issueReactions = await github.paginate(github.rest.reactions.listForIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const prThumbsUp = issueReactions.find(
              (reaction) =>
                reaction.content === '+1' &&
                isCodexActor(reaction.user) &&
                isAfterHead(reaction.created_at, headDate)
            );

            if (prThumbsUp) {
              core.summary
                .addRaw('Result: pass - Codex thumbs-up reaction exists after latest head.')
                .addEOL();
              await core.summary.write();
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            for (const comment of comments) {
              const body = comment.body || '';
              const relevantComment =
                body.includes('@codex review') || isCodexActor(comment.user);
              if (!relevantComment) {
                continue;
              }

              const reactions = await github.paginate(
                github.rest.reactions.listForIssueComment,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                  per_page: 100,
                }
              );

              const commentThumbsUp = reactions.find(
                (reaction) =>
                  reaction.content === '+1' &&
                  isCodexActor(reaction.user) &&
                  isAfterHead(reaction.created_at, headDate)
              );

              if (commentThumbsUp) {
                core.summary
                  .addRaw(
                    'Result: pass - Codex thumbs-up reaction on a review-related comment exists after latest head.'
                  )
                  .addEOL();
                await core.summary.write();
                return;
              }
            }

            core.summary
              .addRaw('Result: fail - no Codex review signal exists for latest head.')
              .addEOL()
              .addRaw('Action: wait for Codex auto-review, or comment `@codex review` and re-run this check after Codex responds.')
              .addEOL();
            await core.summary.write();
            core.setFailed(
              `No Codex review, Codex approval/comment, or Codex thumbs-up reaction found for latest head ${headSha}.`
            );
