<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Package Public Surface Map</title>
  <desc id="desc">Map of omniweb-toolkit package exports and the current package-to-root adapter posture.</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #111827; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle, .small { font-size: 12px; fill: #6b7280; }
    .label { font-size: 15px; font-weight: 650; }
    .section { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 10; ry: 10; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 8; ry: 8; }
    .root { fill: #eff6ff; stroke: #bfdbfe; }
    .runtime { fill: #fff7ed; stroke: #fed7aa; }
    .agent { fill: #faf5ff; stroke: #ddd6fe; }
    .write { fill: #fef2f2; stroke: #fecaca; }
    .types { fill: #f0fdfa; stroke: #99f6e4; }
    .research { fill: #f0fdf4; stroke: #bbf7d0; }
    .gray { fill: #f9fafb; stroke: #d1d5db; }
    .arrow { fill: none; stroke-width: 2; }
    .dashed { stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="48" y="48" class="title">Package Public Surface Map</text>
  <text x="48" y="72" class="subtitle">What consumers see from package.json exports, and where root internals sit behind package adapters.</text>

  <rect x="55" y="115" width="250" height="510" class="section gray"/>
  <text x="80" y="145" class="label">Consumer Import Boundary</text>
  <rect x="90" y="188" width="180" height="56" class="box root"/>
  <text x="180" y="211" text-anchor="middle" class="label">package.json</text>
  <text x="180" y="231" text-anchor="middle" class="small">six public subpaths</text>
  <rect x="90" y="420" width="180" height="76" class="box gray"/>
  <text x="180" y="449" text-anchor="middle" class="label">Consumers</text>
  <text x="180" y="470" text-anchor="middle" class="small">apps, agents, skills</text>

  <rect x="360" y="105" width="500" height="540" class="section"/>
  <text x="385" y="135" class="label">Public Export Surface</text>
  <rect x="405" y="165" width="180" height="80" class="box root"/>
  <text x="495" y="195" text-anchor="middle" class="label">.</text>
  <text x="495" y="216" text-anchor="middle" class="small">read client substrate</text>
  <rect x="635" y="165" width="180" height="80" class="box runtime"/>
  <text x="725" y="195" text-anchor="middle" class="label">./runtime</text>
  <text x="725" y="216" text-anchor="middle" class="small">connect, readiness</text>
  <rect x="405" y="290" width="180" height="80" class="box agent"/>
  <text x="495" y="320" text-anchor="middle" class="label">./agent</text>
  <text x="495" y="341" text-anchor="middle" class="small">operator + minimal cycle</text>
  <rect x="635" y="290" width="180" height="80" class="box write"/>
  <text x="725" y="320" text-anchor="middle" class="label">./write</text>
  <text x="725" y="341" text-anchor="middle" class="small">write-intent helpers</text>
  <rect x="405" y="415" width="180" height="80" class="box types"/>
  <text x="495" y="445" text-anchor="middle" class="label">./types</text>
  <text x="495" y="466" text-anchor="middle" class="small">pure type surface</text>
  <rect x="635" y="415" width="180" height="80" class="box research"/>
  <text x="725" y="445" text-anchor="middle" class="label">./research-agent-minimal</text>
  <text x="725" y="466" text-anchor="middle" class="small">small compatibility path</text>
  <rect x="455" y="545" width="310" height="60" class="box gray"/>
  <text x="610" y="571" text-anchor="middle" class="label">Package docs + references</text>
  <text x="610" y="591" text-anchor="middle" class="small">contract, proof, routing, validation</text>

  <rect x="915" y="115" width="230" height="510" class="section gray"/>
  <text x="940" y="145" class="label">Behind The Surface</text>
  <rect x="950" y="185" width="160" height="58" class="box gray"/>
  <text x="1030" y="209" text-anchor="middle" class="label">src/toolkit</text>
  <text x="1030" y="229" text-anchor="middle" class="small">mechanism</text>
  <rect x="950" y="290" width="160" height="58" class="box gray"/>
  <text x="1030" y="314" text-anchor="middle" class="label">src/lib</text>
  <text x="1030" y="334" text-anchor="middle" class="small">policy + strategy</text>
  <rect x="950" y="395" width="160" height="58" class="box gray"/>
  <text x="1030" y="419" text-anchor="middle" class="label">root CLI</text>
  <text x="1030" y="439" text-anchor="middle" class="small">support utilities</text>
  <rect x="950" y="500" width="160" height="58" class="box gray"/>
  <text x="1030" y="524" text-anchor="middle" class="label">adapters</text>
  <text x="1030" y="544" text-anchor="middle" class="small">implementation only</text>

  <path d="M 270 216 L 405 205" class="arrow" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path d="M 270 216 L 635 205" class="arrow" stroke="#ea580c" marker-end="url(#arrow-orange)"/>
  <path d="M 270 216 L 405 330" class="arrow" stroke="#9333ea" marker-end="url(#arrow-purple)"/>
  <path d="M 270 216 L 635 330" class="arrow" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <path d="M 270 216 L 405 455" class="arrow" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <path d="M 270 216 L 635 455" class="arrow" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <path d="M 180 420 L 180 244" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <text x="205" y="337" class="small">import</text>

  <path d="M 815 205 L 950 214" class="arrow dashed" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <path d="M 815 330 L 950 319" class="arrow dashed" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <path d="M 725 370 C 860 390, 900 430, 950 424" class="arrow dashed" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <text x="880" y="180" class="small">adapter posture</text>

  <rect x="95" y="660" width="1010" height="50" class="box gray"/>
  <text x="120" y="690" class="small">Boundary posture: package subpaths stay stable; root imports behind them are implementation details. Compatibility exports remain compatibility, not equal default front doors.</text>
</svg>
