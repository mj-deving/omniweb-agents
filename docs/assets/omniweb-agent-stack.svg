<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .title { fill: #111827; font-size: 30px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 15px; }
    .layer-label { fill: #374151; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .node-title { fill: #111827; font-size: 16px; font-weight: 700; }
    .node-sub { fill: #4b5563; font-size: 12px; }
    .small { fill: #6b7280; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="60" y="62" class="title">OmniWeb Agent Stack</text>
  <text x="60" y="90" class="subtitle">Thin playbooks over a typed runtime, safety gates, proof loops, and Demos Network substrate.</text>

  <rect x="50" y="120" width="1100" height="120" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.4" stroke-dasharray="7,5"/>
