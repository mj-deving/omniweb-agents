  <rect x="515" y="652" width="165" height="32" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="548" y="673" class="node-sub">Chain + DEM</text>
  <rect x="720" y="652" width="165" height="32" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
