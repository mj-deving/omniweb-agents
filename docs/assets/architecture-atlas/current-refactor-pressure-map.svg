<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Current Refactor Pressure Map</title>
  <desc id="desc">Understand-backed current refactor pressure map for package/root write boundary, legacy agent compatibility exports, minimal-agent centrality, and root shim cleanup.</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #111827; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle, .small { font-size: 12px; fill: #6b7280; }
    .tiny { font-size: 11px; fill: #6b7280; }
    .label { font-size: 15px; font-weight: 650; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 8; ry: 8; }
    .section { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 10; ry: 10; }
    .blue { fill: #eff6ff; stroke: #bfdbfe; }
    .green { fill: #f0fdf4; stroke: #bbf7d0; }
    .purple { fill: #faf5ff; stroke: #ddd6fe; }
    .orange { fill: #fff7ed; stroke: #fed7aa; }
    .red { fill: #fef2f2; stroke: #fecaca; }
    .gray { fill: #f9fafb; stroke: #d1d5db; }
    .arrow { fill: none; stroke-width: 2; }
    .dashed { stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="48" y="48" class="title">Current Refactor Pressure Map</text>
  <text x="48" y="72" class="subtitle">UA graph evidence points at refactor pressure; source and commands still decide whether a change is real.</text>

  <rect x="70" y="120" width="270" height="520" class="section gray"/>
  <text x="95" y="150" class="label">UA Snapshot</text>
  <rect x="105" y="188" width="200" height="70" class="box blue"/>
  <text x="205" y="213" text-anchor="middle" class="label">43c8f22f</text>
  <text x="205" y="235" text-anchor="middle" class="small">graph metadata commit</text>
  <rect x="105" y="295" width="200" height="70" class="box green"/>
  <text x="205" y="320" text-anchor="middle" class="label">1427 files</text>
  <text x="205" y="342" text-anchor="middle" class="small">analyzed files</text>
  <rect x="105" y="402" width="200" height="70" class="box purple"/>
  <text x="205" y="427" text-anchor="middle" class="label">lead map</text>
  <text x="205" y="449" text-anchor="middle" class="small">not deletion authority</text>
  <rect x="105" y="509" width="200" height="70" class="box orange"/>
  <text x="205" y="534" text-anchor="middle" class="label">source proof</text>
  <text x="205" y="556" text-anchor="middle" class="small">required before moves</text>

  <rect x="430" y="120" width="700" height="520" class="section"/>
  <text x="455" y="150" class="label">Pressure Hotspots</text>
  <rect x="485" y="190" width="240" height="92" class="box red"/>
  <text x="605" y="218" text-anchor="middle" class="label">Package / Root Write Boundary</text>
  <text x="605" y="242" text-anchor="middle" class="small">./write imports root write helpers</text>
  <text x="605" y="263" text-anchor="middle" class="tiny">medium risk; public surface</text>

  <rect x="830" y="190" width="240" height="92" class="box purple"/>
  <text x="950" y="218" text-anchor="middle" class="label">Legacy Agent Compatibility</text>
  <text x="950" y="242" text-anchor="middle" class="small">runAgentLoop exports still visible</text>
  <text x="950" y="263" text-anchor="middle" class="tiny">preserve unless importer proof says otherwise</text>

  <rect x="485" y="355" width="240" height="92" class="box orange"/>
  <text x="605" y="383" text-anchor="middle" class="label">Minimal-Agent Centrality</text>
  <text x="605" y="407" text-anchor="middle" class="small">cycle, resolver, executor, verifier</text>
  <text x="605" y="428" text-anchor="middle" class="tiny">classify overload vs stale docs first</text>

  <rect x="830" y="355" width="240" height="92" class="box gray"/>
  <text x="950" y="383" text-anchor="middle" class="label">Root Shim Cleanup</text>
  <text x="950" y="407" text-anchor="middle" class="small">deprecated lib/reactive shims</text>
  <text x="950" y="428" text-anchor="middle" class="tiny">delete only with empty importer proof</text>

  <rect x="660" y="510" width="240" height="78" class="box green"/>
  <text x="780" y="538" text-anchor="middle" class="label">First Safe Lane</text>
  <text x="780" y="562" text-anchor="middle" class="small">package-local quality-gate boundary</text>

  <path d="M 305 223 L 485 236" class="arrow" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <path d="M 305 330 L 830 236" class="arrow" stroke="#9333ea" marker-end="url(#arrow-purple)"/>
  <path d="M 305 437 L 485 401" class="arrow" stroke="#ea580c" marker-end="url(#arrow-orange)"/>
  <path d="M 305 544 L 830 401" class="arrow" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <path d="M 605 447 L 730 510" class="arrow dashed" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <path d="M 950 447 L 830 510" class="arrow dashed" stroke="#16a34a" marker-end="url(#arrow-green)"/>

  <rect x="170" y="685" width="860" height="42" class="box gray"/>
  <text x="600" y="711" text-anchor="middle" class="small">Stop rule: graph centrality alone is not a refactor. Every hotspot needs importer proof, package checks, and no public API drift unless explicitly scoped.</text>
</svg>
