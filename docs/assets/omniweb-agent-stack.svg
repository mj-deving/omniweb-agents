  <rect x="925" y="652" width="165" height="32" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="956" y="673" class="node-sub">Identity + Escrow</text>

  <path d="M 600 240 L 600 274" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)" fill="none"/>
  <path d="M 600 402 L 600 436" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" fill="none"/>
  <path d="M 600 564 L 600 598" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" fill="none"/>
  <rect x="506" y="251" width="188" height="22" rx="6" fill="#ffffff" opacity="0.95"/>
  <text x="600" y="267" text-anchor="middle" class="small">requests become checked operations</text>
  <rect x="506" y="413" width="188" height="22" rx="6" fill="#ffffff" opacity="0.95"/>
  <text x="600" y="429" text-anchor="middle" class="small">tools execute only after gates</text>
  <rect x="506" y="575" width="188" height="22" rx="6" fill="#ffffff" opacity="0.95"/>
  <text x="600" y="591" text-anchor="middle" class="small">substrate supplies live truth</text>
