name: Codex Review Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  codex-review:
    name: codex-review
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Require Codex signal on latest PR head
        uses: actions/github-script@v7
        with:
          script: |
            const codexLogins = new Set([
              'chatgpt-codex-connector[bot]',
              'chatgpt-codex-connector',
            ]);

            async function resolvePullRequest() {
              if (context.payload.pull_request) {
                return context.payload.pull_request;
              }

              if (context.payload.review && context.payload.pull_request) {
                return context.payload.pull_request;
              }

              if (context.payload.issue && context.payload.issue.pull_request) {
                const response = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.issue.number,
                });
                return response.data;
              }

              return null;
            }

            function isCodexActor(user) {
              return user && codexLogins.has(user.login);
            }

            const pr = await resolvePullRequest();
            if (!pr) {
              core.setFailed('Codex review gate only runs for pull requests.');
              return;
            }

            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const headSha = pull.data.head.sha;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const codexReviews = reviews.filter((review) => isCodexActor(review.user));
            const codexHeadReviews = codexReviews
              .filter((review) => review.commit_id === headSha)
              .sort(
                (left, right) =>
                  new Date(right.submitted_at).valueOf() -
                  new Date(left.submitted_at).valueOf()
              );
            const latestHeadReview = codexHeadReviews[0];

            core.summary
              .addHeading('Codex review gate')
              .addRaw(`PR: #${pr.number}`)
              .addEOL()
              .addRaw(`Head SHA: ${headSha}`)
              .addEOL()
              .addRaw(`Codex reviews found: ${codexReviews.length}`)
              .addEOL()
              .addRaw(`Codex reviews on head: ${codexHeadReviews.length}`)
              .addEOL();

            if (!latestHeadReview) {
              core.summary
                .addRaw('Result: fail - no Codex review exists for latest head.')
                .addEOL()
                .addRaw('Action: wait for Codex auto-review, or comment `@codex review` and re-run this check after Codex responds.')
                .addEOL();
              await core.summary.write();
              core.setFailed(`No Codex review found for latest head ${headSha}.`);
              return;
            }

            if (latestHeadReview.state === 'CHANGES_REQUESTED') {
              core.summary
                .addRaw('Result: fail - latest Codex review requested changes on the latest head.')
                .addEOL();
              await core.summary.write();
              core.setFailed('Latest Codex review requested changes on the latest PR head.');
              return;
            }

            if (['APPROVED', 'COMMENTED'].includes(latestHeadReview.state)) {
              core.summary
                .addRaw(
                  `Result: pass - latest Codex review on head is ${latestHeadReview.state.toLowerCase()}.`
                )
                .addEOL();
              await core.summary.write();
              return;
            }

            core.summary
              .addRaw(`Result: fail - latest Codex review state is ${latestHeadReview.state}.`)
              .addEOL();
            await core.summary.write();
            core.setFailed(`Unsupported latest Codex review state: ${latestHeadReview.state}.`);
