name: Validate Plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci

      # ── Deterministic gates (block merge) ──────────
      - name: Type check
        run: npx tsc --noEmit
      - name: Run operator-core regression gates
        working-directory: packages/omniweb-toolkit
        run: npm run check:core
      - name: Run front-door honesty gates
        working-directory: packages/omniweb-toolkit
        run: npm run check:frontdoor

      # ── Build ────────────────────────────────────────
      - name: Build toolkit package
        working-directory: packages/omniweb-toolkit
        run: npm run build

      # ── Claim / release proof checks on main only ──
      - name: Run eval integrity checks
        if: github.event_name == 'push'
        working-directory: packages/omniweb-toolkit
        run: npm run check:evals
