  <text x="921" y="207" class="node-sub">operator packaging</text>

  <rect x="50" y="282" width="1100" height="120" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4" stroke-dasharray="7,5"/>
