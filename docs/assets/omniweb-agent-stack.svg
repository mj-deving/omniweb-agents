  <rect x="105" y="327" width="215" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="126" y="350" class="node-title">CLI Probes</text>
  <text x="126" y="369" class="node-sub">dry-run and live gates</text>
  <rect x="370" y="327" width="215" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="391" y="350" class="node-title">Package Checks</text>
