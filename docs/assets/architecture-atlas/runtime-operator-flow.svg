<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Runtime Operator Flow</title>
  <desc id="desc">Maintained operator front door from package CLI or starter through colony operator, minimal cycle, policy intent, executor, and readback proof.</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #111827; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle, .small { font-size: 12px; fill: #6b7280; }
    .tiny { font-size: 11px; fill: #6b7280; }
    .label { font-size: 15px; font-weight: 650; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 8; ry: 8; }
    .blue { fill: #eff6ff; stroke: #bfdbfe; }
    .green { fill: #f0fdf4; stroke: #bbf7d0; }
    .purple { fill: #faf5ff; stroke: #ddd6fe; }
    .orange { fill: #fff7ed; stroke: #fed7aa; }
    .red { fill: #fef2f2; stroke: #fecaca; }
    .gray { fill: #f9fafb; stroke: #d1d5db; }
    .section { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 10; ry: 10; }
    .arrow { fill: none; stroke-width: 2.2; }
    .thin { stroke-width: 1.6; }
    .dashed { stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="48" y="48" class="title">Runtime / Operator Flow</text>
  <text x="48" y="72" class="subtitle">Active product front door: package CLI or starter into colony-operator, minimal cycle, policy intent, execution, then readback/proof.</text>

  <rect x="55" y="125" width="1090" height="265" class="section gray"/>
  <text x="82" y="155" class="label">Maintained Operator Path</text>
  <rect x="90" y="210" width="145" height="78" class="box blue"/>
  <text x="162" y="239" text-anchor="middle" class="label">Package CLI</text>
  <text x="162" y="260" text-anchor="middle" class="small">or starter asset</text>
  <rect x="280" y="210" width="155" height="78" class="box purple"/>
  <text x="358" y="239" text-anchor="middle" class="label">Colony</text>
  <text x="358" y="260" text-anchor="middle" class="label">Operator</text>
  <rect x="480" y="210" width="155" height="78" class="box green"/>
  <text x="558" y="239" text-anchor="middle" class="label">Minimal</text>
  <text x="558" y="260" text-anchor="middle" class="label">Cycle</text>
  <rect x="680" y="210" width="155" height="78" class="box orange"/>
  <text x="758" y="239" text-anchor="middle" class="label">Policy</text>
  <text x="758" y="260" text-anchor="middle" class="label">Intent</text>
  <rect x="880" y="210" width="155" height="78" class="box red"/>
  <text x="958" y="239" text-anchor="middle" class="label">Executor</text>
  <text x="958" y="260" text-anchor="middle" class="small">guarded action</text>
  <rect x="1055" y="210" width="70" height="78" class="box gray"/>
  <text x="1090" y="239" text-anchor="middle" class="label">Proof</text>
  <text x="1090" y="260" text-anchor="middle" class="small">readback</text>

  <path d="M 235 249 L 280 249" class="arrow" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path d="M 435 249 L 480 249" class="arrow" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path d="M 635 249 L 680 249" class="arrow" stroke="#ea580c" marker-end="url(#arrow-orange)"/>
  <path d="M 835 249 L 880 249" class="arrow" stroke="#ea580c" marker-end="url(#arrow-orange)"/>
  <path d="M 1035 249 L 1055 249" class="arrow" stroke="#16a34a" marker-end="url(#arrow-green)"/>

  <rect x="80" y="430" width="260" height="210" class="section"/>
  <text x="105" y="461" class="label">Runtime Substrate</text>
  <rect x="110" y="495" width="92" height="48" class="box blue"/>
  <text x="156" y="524" text-anchor="middle" class="small">connect()</text>
  <rect x="220" y="495" width="92" height="48" class="box green"/>
  <text x="266" y="524" text-anchor="middle" class="small">readiness</text>
  <rect x="110" y="565" width="92" height="48" class="box orange"/>
  <text x="156" y="594" text-anchor="middle" class="small">capability</text>
  <rect x="220" y="565" width="92" height="48" class="box purple"/>
  <text x="266" y="594" text-anchor="middle" class="small">session</text>

  <rect x="470" y="430" width="260" height="210" class="section"/>
  <text x="495" y="461" class="label">Execution Boundary</text>
  <rect x="505" y="495" width="190" height="48" class="box red"/>
  <text x="600" y="524" text-anchor="middle" class="small">publish / reply / react / tip</text>
  <rect x="505" y="565" width="190" height="48" class="box orange"/>
  <text x="600" y="594" text-anchor="middle" class="small">market write intents</text>

  <rect x="860" y="430" width="260" height="210" class="section"/>
  <text x="885" y="461" class="label">Proof Result</text>
  <rect x="895" y="495" width="190" height="48" class="box green"/>
  <text x="990" y="524" text-anchor="middle" class="small">chain acceptance</text>
  <rect x="895" y="565" width="190" height="48" class="box blue"/>
  <text x="990" y="594" text-anchor="middle" class="small">API/product readback</text>

  <path d="M 300 430 C 390 365, 785 350, 925 288" class="arrow thin dashed" stroke="#6b7280" marker-end="url(#arrow-gray)"/>
  <text x="590" y="378" text-anchor="middle" class="tiny">capability and readiness feed execution</text>
  <path d="M 730 535 L 860 520" class="arrow thin" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <path d="M 860 590 L 730 590" class="arrow thin dashed" stroke="#9333ea" marker-end="url(#arrow-purple)"/>
  <text x="795" y="613" text-anchor="middle" class="tiny">proof closes cycle</text>
  <path d="M 1090 288 C 1090 350, 680 360, 558 288" class="arrow thin dashed" stroke="#9333ea" marker-end="url(#arrow-purple)"/>
  <text x="865" y="350" text-anchor="middle" class="tiny">verdict and artifacts</text>

  <g transform="translate(80, 700)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="42" y="4" class="tiny">main flow</text>
    <line x1="150" y1="0" x2="182" y2="0" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="192" y="4" class="tiny">decision/control</text>
    <line x1="340" y1="0" x2="372" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="382" y="4" class="tiny">proof/readback</text>
    <line x1="550" y1="0" x2="582" y2="0" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-purple)"/>
    <text x="592" y="4" class="tiny">feedback</text>
  </g>
</svg>
