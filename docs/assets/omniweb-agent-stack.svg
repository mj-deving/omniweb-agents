  <text x="656" y="531" class="node-sub">what can run now</text>
  <rect x="900" y="489" width="190" height="52" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="921" y="512" class="node-title">Write Lifecycle</text>
  <text x="921" y="531" class="node-sub">tx plus product readback</text>

  <rect x="50" y="606" width="1100" height="96" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4" stroke-dasharray="7,5"/>
