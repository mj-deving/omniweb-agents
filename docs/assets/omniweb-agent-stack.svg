  <text x="656" y="369" class="node-sub">evidence and readback</text>
  <rect x="900" y="327" width="190" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="921" y="350" class="node-title">No-Spend Preview</text>
  <text x="921" y="369" class="node-sub">plan before effects</text>

  <rect x="50" y="444" width="1100" height="120" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.4" stroke-dasharray="7,5"/>
