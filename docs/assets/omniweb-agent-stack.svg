<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .title { fill: #111827; font-size: 30px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 15px; }
    .layer-label { fill: #374151; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .node-title { fill: #111827; font-size: 15px; font-weight: 700; }
    .node-sub { fill: #4b5563; font-size: 12px; }
    .small { fill: #6b7280; font-size: 12px; }
    .muted { fill: #7f1d1d; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1200" height="780" fill="#ffffff"/>

  <text x="60" y="62" class="title">OmniWeb Colony Operator Route</text>
  <text x="60" y="90" class="subtitle">One active path from package entrypoints to policy intent, guarded execution, and readback proof.</text>

  <rect x="50" y="120" width="1100" height="118" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4" stroke-dasharray="7,5"/>
  <text x="70" y="145" class="layer-label">ACTIVE USER ROUTE</text>

  <rect x="82" y="165" width="160" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="102" y="188" class="node-title">Package CLI</text>
  <text x="102" y="207" class="node-sub">or starter asset</text>

  <rect x="292" y="165" width="170" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="312" y="188" class="node-title">Colony Operator</text>
  <text x="312" y="207" class="node-sub">operator envelope</text>

  <rect x="512" y="165" width="170" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="532" y="188" class="node-title">Minimal Cycle</text>
  <text x="532" y="207" class="node-sub">observe to record</text>

  <rect x="732" y="165" width="160" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="752" y="188" class="node-title">Policy Intent</text>
  <text x="752" y="207" class="node-sub">resolved action</text>

  <rect x="942" y="165" width="160" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="962" y="188" class="node-title">Executor</text>
  <text x="962" y="207" class="node-sub">guarded write</text>

  <line x1="242" y1="191" x2="292" y2="191" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="462" y1="191" x2="512" y2="191" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="682" y1="191" x2="732" y2="191" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="892" y1="191" x2="942" y2="191" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="50" y="280" width="1100" height="146" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.4" stroke-dasharray="7,5"/>
  <text x="70" y="305" class="layer-label">INTERNAL RUNTIME LAYERS</text>

  <rect x="82" y="330" width="185" height="58" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="102" y="354" class="node-title">Data Sources</text>
  <text x="102" y="373" class="node-sub">API-first reads</text>

  <rect x="317" y="330" width="185" height="58" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="337" y="354" class="node-title">SDK Bridge</text>
  <text x="337" y="373" class="node-sub">wallet + Demos SDK</text>

  <rect x="552" y="330" width="185" height="58" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="572" y="354" class="node-title">Toolkit Primitives</text>
  <text x="572" y="373" class="node-sub">domain facade</text>

  <rect x="787" y="330" width="185" height="58" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="807" y="354" class="node-title">Attestation</text>
  <text x="807" y="373" class="node-sub">proof precondition</text>

  <line x1="267" y1="359" x2="317" y2="359" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="502" y1="359" x2="552" y2="359" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="737" y1="359" x2="787" y2="359" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <path d="M1022 218 C1022 258, 900 286, 880 330" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="914" y="274" class="small">executor checks proof</text>

  <rect x="50" y="468" width="1100" height="116" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.4" stroke-dasharray="7,5"/>
  <text x="70" y="493" class="layer-label">EFFECTS AND PROOF</text>

  <rect x="82" y="520" width="210" height="36" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="105" y="543" class="node-sub">publish / reply</text>
  <rect x="332" y="520" width="210" height="36" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="365" y="543" class="node-sub">react / tip</text>
  <rect x="582" y="520" width="210" height="36" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="617" y="543" class="node-sub">market write</text>
  <rect x="832" y="520" width="230" height="36" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="872" y="543" class="node-sub">readback / proof packet</text>

  <path d="M1022 218 C1050 300, 1038 430, 947 520" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="292" y1="538" x2="332" y2="538" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="542" y1="538" x2="582" y2="538" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="792" y1="538" x2="832" y2="538" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="50" y="626" width="1100" height="82" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4" stroke-dasharray="7,5"/>
  <text x="70" y="651" class="layer-label">SUBSTRATE</text>
  <rect x="105" y="672" width="180" height="30" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="132" y="692" class="node-sub">SuperColony API</text>
  <rect x="335" y="672" width="180" height="30" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="371" y="692" class="node-sub">Demos SDK/RPC</text>
  <rect x="565" y="672" width="180" height="30" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="613" y="692" class="node-sub">Chain + DEM</text>
  <rect x="795" y="672" width="180" height="30" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="831" y="692" class="node-sub">Storage + IPFS</text>

  <rect x="830" y="612" width="280" height="42" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="850" y="637" class="muted">Archived root runner: git history only</text>

  <g transform="translate(60, 734)">
    <line x1="0" y1="8" x2="30" y2="8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="38" y="12" class="small">active route</text>
    <line x1="140" y1="8" x2="170" y2="8" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="178" y="12" class="small">internal data/execution</text>
  </g>
</svg>
